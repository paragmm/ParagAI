# Training Configuration
training:
  batch_size: 32
  learning_rate: 6.0e-4
  min_lr: 6.0e-5
  warmup_iters: 200
  max_iters: 5000
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 250
  eval_iters: 50
  device: "auto"  # "auto", "cuda", or "cpu"
  checkpoint_dir: "checkpoints"
  data_dir: "data/processed"

